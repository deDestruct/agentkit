[project]
name = "agentkit"
version = "0.1.0"
description = "Tools for agents tasks"
readme = "README.md"
authors = [
    { name = "deDestruct", email = "131010266+deDestruct@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.1.3",
    "pillow>=13.0.0",
    "pypdfium2>=5.15.2",
    "python-docx>=1.2.0",
]

[project.scripts]
agentkit = "agentkit.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "ty>=0.0.105",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = ["integration: requires external binaries or services"]

[tool.coverage.run]
branch = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501", "W293"]
